<div class="dads-mock-shell">
  <header class="dads-mock-topbar">
    <div class="dads-mock-brand">
      <span>Artifact Share Agent Skills</span>
      <span class="dads-badge dads-badge--primary">DADS 完全準拠パック</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
      <code
        id="install-cmd"
        style="
          background: var(--color-neutral-solid-gray-50);
          border: 1px solid var(--color-neutral-solid-gray-200);
          padding: 6px 12px;
          border-radius: var(--border-radius-8);
          font-size: var(--font-size-14);
          color: var(--color-neutral-solid-gray-900);
        "
        >npx skills add artifactshare/skills</code
      >
      <button
        type="button"
        class="dads-button"
        data-size="sm"
        data-type="solid-fill"
        id="copy-install-btn"
      >
        コマンドをコピー
      </button>
    </div>
  </header>

  <main class="dads-mock-main" style="max-width: 1280px">
    <div class="dads-mock-page-head" style="margin-bottom: 16px">
      <div style="flex: 1 1 620px">
        <h1>デジタル庁デザインシステム準拠 HTML ライブショーケース</h1>
        <p class="dads-mock-banner-note" style="margin-top: 6px">
          公式トークン全量（v2.1.0）・公式 HTML コンポーネント全 43 種・2026 年版ダッシュボード 7 色テーマを単一 HTML へ自動バンドル。下のタブで 4 種類の実物をそのまま操作できます。
        </p>
      </div>
      <a
        id="open-standalone"
        class="dads-button"
        data-size="sm"
        data-type="outline"
        href="./dashboard.html"
        target="_blank"
        rel="noopener"
      >
        全画面で開く
      </a>
    </div>

    <div
      style="
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: #f1f1f4;
        padding: 10px 16px;
        border-radius: var(--border-radius-12);
        margin-bottom: 16px;
      "
    >
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px" role="group" aria-label="デモ切替">
        <button type="button" class="dads-button" data-size="sm" data-type="solid-fill" data-demo="dashboard" data-file="./dashboard.html">
          KPI ダッシュボード
        </button>
        <button type="button" class="dads-button" data-size="sm" data-type="outline" data-demo="doc" data-file="./doc.html">
          技術検討レポート
        </button>
        <button type="button" class="dads-button" data-size="sm" data-type="outline" data-demo="mockup" data-file="./mockup.html">
          動く業務 UI モック
        </button>
        <button type="button" class="dads-button" data-size="sm" data-type="outline" data-demo="slides" data-file="./slides.html">
          16:9 技術発表スライド
        </button>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px" role="group" aria-label="7色パレット切替">
        <span style="font-size: var(--font-size-14); font-weight: 700; color: var(--color-neutral-black); margin-right: 4px">
          公式 7 色切替:
        </span>
        <button type="button" class="dads-badge" data-switch-palette="blue" style="cursor: pointer">Blue</button>
        <button type="button" class="dads-badge" data-switch-palette="light-blue" style="cursor: pointer">Light Blue</button>
        <button type="button" class="dads-badge" data-switch-palette="cyan" style="cursor: pointer">Cyan</button>
        <button type="button" class="dads-badge dads-badge--primary" data-switch-palette="green" style="cursor: pointer">Green</button>
        <button type="button" class="dads-badge" data-switch-palette="orange" style="cursor: pointer">Orange</button>
        <button type="button" class="dads-badge" data-switch-palette="red" style="cursor: pointer">Red</button>
        <button type="button" class="dads-badge" data-switch-palette="solid-gray" style="cursor: pointer">Gray</button>
      </div>
    </div>

    <div
      style="
        border: 1px solid var(--color-neutral-solid-gray-200);
        border-radius: var(--border-radius-12);
        overflow: hidden;
        background: var(--color-neutral-white);
      "
    >
      <iframe
        id="showcase-frame"
        src="./dashboard.html"
        title="DADS Agent Skills ライブプレビュー"
        style="width: 100%; height: 760px; border: 0; display: block"
      ></iframe>
    </div>
  </main>
</div>
